<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>💬 PeerJS 节点 (二合一)</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #app {
            max-width: 520px;
            width: 100%;
            height: 100%;
            max-height: 820px;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .header {
            padding: 16px 20px;
            background: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header .mode-badge {
            background: #3b82f6;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
        }
        .tabs {
            display: flex;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
        }
        .tabs button {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 3px solid transparent;
        }
        .tabs button.active {
            color: #0f172a;
            border-bottom-color: #3b82f6;
            background: white;
        }
        .tab-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .tab-pane {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }
        .tab-pane.active { display: flex; }

        .server-controls {
            padding: 12px 20px;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .server-controls input {
            flex: 1;
            padding: 6px 12px;
            border: 2px solid #d1d9e6;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            min-width: 100px;
        }
        .server-controls input:focus { border-color: #3b82f6; }
        .server-controls .btn-group { display: flex; gap: 6px; }
        .btn-primary { background: #3b82f6; color: white; border: none; padding: 6px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 6px 16px; border-radius: 30px; font-weight: 600; cursor: pointer; }
        .btn-primary:disabled, .btn-danger:disabled { opacity: 0.5; cursor: not-allowed; }

        .server-status {
            padding: 8px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            flex-wrap: wrap;
            gap: 6px 16px;
            font-size: 13px;
            color: #0f172a;
            flex-shrink: 0;
            align-items: center;
        }
        .server-status .label { color: #64748b; }
        .server-status .value { font-weight: 500; }
        .server-status .status-badge {
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.off { background: #e2e8f0; color: #64748b; }
        .status-badge.on { background: #bbf7d0; color: #15803d; }
        .status-badge.error { background: #fecaca; color: #dc2626; }
        .client-list {
            padding: 6px 20px;
            background: #f8fafc;
            font-size: 13px;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
            flex-shrink: 0;
            max-height: 70px;
            overflow-y: auto;
        }
        .client-list .client-item {
            display: inline-block;
            background: #dbeafe;
            padding: 2px 12px;
            border-radius: 30px;
            margin: 2px 4px 2px 0;
            font-size: 12px;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #ffffff;
        }
        .message {
            max-width: 88%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            background: #eef2f6;
            color: #0f172a;
            align-self: flex-start;
        }
        .message.mine {
            background: #3b82f6;
            color: white;
            align-self: flex-end;
        }
        .message.system {
            background: #f1f5f9;
            color: #475569;
            font-size: 13px;
            text-align: center;
            align-self: center;
            max-width: 90%;
            border-radius: 30px;
            padding: 6px 16px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 2px;
            display: block;
        }
        .message.mine .sender { color: rgba(255,255,255,0.8); }
        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            display: block;
            text-align: right;
        }
        .input-area {
            padding: 10px 16px 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-shrink: 0;
        }
        .input-area input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
            background: #f8fafc;
        }
        .input-area input[type="text"]:focus {
            border-color: #3b82f6;
            background: white;
        }
        .input-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .status-msg {
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #64748b;
        }
        .login-area {
            padding: 16px 20px 12px;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-shrink: 0;
            border-bottom: 1px solid #e2e8f0;
        }
        .login-area input {
            padding: 10px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 30px;
            font-size: 14px;
            outline: none;
        }
        .login-area input:focus { border-color: #3b82f6; }
        .login-area button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
        }
        .login-area .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            display: none;
            background: #fee2e2;
            padding: 6px;
            border-radius: 8px;
        }
        .login-area .info {
            background: #e0e7ff;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #4338ca;
            text-align: center;
        }
        .client-toolbar {
            padding: 8px 20px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            font-size: 14px;
            color: #0f172a;
        }
        .client-toolbar label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .client-toolbar input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h1>💬 PeerJS 节点</h1>
        <span class="mode-badge" id="modeBadge">服务器</span>
    </div>

    <div class="tabs">
        <button class="active" data-tab="server">📡 服务器模式</button>
        <button data-tab="client">👤 客户端模式</button>
    </div>

    <div class="tab-content">
        <!-- 服务器面板 -->
        <div class="tab-pane active" id="serverPane">
            <div class="server-controls">
                <input type="text" id="serverNameInput" placeholder="服务器节点名称（必填）" value="">
                <div class="btn-group">
                    <button class="btn-primary" id="startServerBtn">▶ 启动</button>
                    <button class="btn-danger" id="stopServerBtn" disabled>⏹ 停止</button>
                </div>
            </div>
            <div class="server-status">
                <span><span class="label">节点 ID:</span> <span class="value" id="serverNodeId">—</span></span>
                <span><span class="label">状态:</span> <span class="status-badge off" id="serverStatusBadge">未启动</span></span>
                <span><span class="label">在线:</span> <span class="value" id="onlineCount">0</span></span>
            </div>
            <div class="client-list" id="clientList"><span style="color:#94a3b8;">暂无客户端</span></div>
            <div class="chat-container" id="serverChatContainer">
                <div class="status-msg">点击「启动」开始监听</div>
            </div>
            <div class="input-area">
                <input type="text" id="serverMsgInput" placeholder="广播消息..." disabled>
                <button id="serverSendBtn" disabled>广播</button>
            </div>
        </div>

        <!-- 客户端面板 -->
        <div class="tab-pane" id="clientPane">
            <div class="login-area" id="clientLoginArea">
                <input type="text" id="clientServerName" placeholder="服务器节点名称（必填）" value="">
                <input type="text" id="clientUserName" placeholder="你的昵称（必填）" maxlength="20" value="">
                <button id="clientConnectBtn">🔗 连接</button>
                <div class="error-msg" id="clientError"></div>
                <div class="info">🌐 通过公共信令服务器 (0.peerjs.com)</div>
            </div>
            <div class="client-toolbar">
                <label>
                    <input type="checkbox" id="showSystemMsg" checked>
                    显示加入/离开消息
                </label>
                <span style="font-size:12px;color:#64748b;">(仅对当前会话生效)</span>
            </div>
            <div class="chat-container" id="clientChatContainer">
                <div class="status-msg">请先连接服务器</div>
            </div>
            <div class="input-area">
                <input type="text" id="clientMsgInput" placeholder="输入消息..." disabled>
                <button id="clientSendBtn" disabled>发送</button>
            </div>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // 全局配置
    // ============================================================
    const STORAGE_KEY = 'peerjs_chat_history';  // 所有节点共享
    const MAX_HISTORY = 50;

    // ============================================================
    // 历史消息操作（共享存储）
    // ============================================================
    function getHistory() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch { return []; }
    }
    function saveHistory(history) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    }
    function addHistory(sender, content, timestamp, time) {
        const h = getHistory();
        h.push({ sender, content, timestamp, time });
        if (h.length > 500) h.splice(0, h.length - 500);
        saveHistory(h);
    }
    function getRecent(limit = MAX_HISTORY) {
        const h = getHistory();
        return h.slice(-limit);
    }
    function clearHistory() {
        localStorage.removeItem(STORAGE_KEY);
    }

    function fmtTime() { return new Date().toLocaleTimeString(); }
    function fmtTimestamp() { return new Date().toISOString(); }

    // ============================================================
    // DOM 引用
    // ============================================================
    const tabs = document.querySelectorAll('.tabs button');
    const panes = { server: document.getElementById('serverPane'), client: document.getElementById('clientPane') };
    const modeBadge = document.getElementById('modeBadge');

    const serverNameInput = document.getElementById('serverNameInput');
    const startServerBtn = document.getElementById('startServerBtn');
    const stopServerBtn = document.getElementById('stopServerBtn');
    const serverNodeId = document.getElementById('serverNodeId');
    const serverStatusBadge = document.getElementById('serverStatusBadge');
    const onlineCount = document.getElementById('onlineCount');
    const clientList = document.getElementById('clientList');
    const serverChat = document.getElementById('serverChatContainer');
    const serverMsgInput = document.getElementById('serverMsgInput');
    const serverSendBtn = document.getElementById('serverSendBtn');

    const clientServerName = document.getElementById('clientServerName');
    const clientUserName = document.getElementById('clientUserName');
    const clientConnectBtn = document.getElementById('clientConnectBtn');
    const clientError = document.getElementById('clientError');
    const clientChat = document.getElementById('clientChatContainer');
    const clientMsgInput = document.getElementById('clientMsgInput');
    const clientSendBtn = document.getElementById('clientSendBtn');
    const showSystemMsg = document.getElementById('showSystemMsg');

    // ============================================================
    // 客户端消息渲染
    // ============================================================
    let clientAllMessages = [];

    function renderClientMessages() {
        const container = clientChat;
        while (container.firstChild) container.removeChild(container.firstChild);
        if (clientAllMessages.length === 0) {
            const div = document.createElement('div');
            div.className = 'status-msg';
            div.textContent = '暂无消息，开始聊天吧！';
            container.appendChild(div);
            return;
        }

        const showSys = showSystemMsg.checked;
        for (const msg of clientAllMessages) {
            const isSystem = (msg.sender === '系统');
            if (isSystem) {
                if (!showSys) {
                    const content = msg.content || '';
                    if (content.includes('加入了聊天室') || content.includes('离开了聊天室')) {
                        continue;
                    }
                }
            }
            const div = document.createElement('div');
            div.className = 'message';
            if (isSystem) {
                div.classList.add('system');
                div.textContent = msg.content;
            } else {
                if (msg.isMine) div.classList.add('mine');
                const s = document.createElement('span');
                s.className = 'sender';
                s.textContent = msg.sender;
                div.appendChild(s);
                const c = document.createElement('span');
                c.textContent = msg.content;
                div.appendChild(c);
                const t = document.createElement('span');
                t.className = 'time';
                t.textContent = msg.time || fmtTime();
                div.appendChild(t);
            }
            container.appendChild(div);
        }
        container.scrollTop = container.scrollHeight;
    }

    function addClientMessage(sender, content, time, isMine = false) {
        clientAllMessages.push({ sender, content, time, isMine });
        renderClientMessages();
    }

    function clearClientMessages() {
        clientAllMessages = [];
        renderClientMessages();
    }

    function setClientStatus(msg) {
        const container = clientChat;
        container.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'status-msg';
        div.textContent = msg;
        container.appendChild(div);
    }

    // ============================================================
    // 服务器逻辑
    // ============================================================
    let serverPeer = null;
    let serverConnections = new Map();
    let serverStarted = false;

    function updateServerUI() {
        onlineCount.textContent = serverConnections.size;
        const names = Array.from(serverConnections.values()).map(info => info.userName);
        if (names.length === 0) {
            clientList.innerHTML = '<span style="color:#94a3b8;">暂无客户端</span>';
        } else {
            clientList.innerHTML = names.map(n => `<span class="client-item">${n}</span>`).join('');
        }
    }

    function broadcast(sender, content, timestamp, time, excludePeer = null) {
        const msg = { type: 'text', sender, content, timestamp, time };
        const json = JSON.stringify(msg);
        let count = 0;
        for (const [pid, info] of serverConnections) {
            if (pid === excludePeer) continue;
            try { info.conn.send(json); count++; } catch (e) { console.warn('发送失败', e); }
        }
        console.log(`📤 广播给 ${count} 个客户端`);
    }

    function startServer() {
        if (serverStarted) return;
        const name = serverNameInput.value.trim();
        if (!name) {
            alert('请先输入服务器节点名称');
            serverNameInput.focus();
            return;
        }

        if (serverPeer) { serverPeer.destroy(); serverPeer = null; }

        serverStarted = true;
        startServerBtn.disabled = true;
        stopServerBtn.disabled = false;
        serverNameInput.disabled = true;
        startServerBtn.textContent = '⏳ 启动中...';
        serverStatusBadge.textContent = '注册中...';
        serverStatusBadge.className = 'status-badge off';

        serverPeer = new Peer(name, {
            debug: 2,
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        serverPeer.on('open', (id) => {
            console.log('✅ 服务器节点已注册:', id);
            serverNodeId.textContent = id;
            serverStatusBadge.textContent = '✅ 运行中';
            serverStatusBadge.className = 'status-badge on';
            startServerBtn.textContent = '✅ 已启动';
            startServerBtn.disabled = true;
            serverMsgInput.disabled = false;
            serverSendBtn.disabled = false;
            setServerStatus('服务器已启动，等待客户端连接...');
        });

        serverPeer.on('connection', (conn) => {
            console.log('📨 新连接:', conn.peer);
            let userName = '未知用户';
            let loggedIn = false;

            const handler = (data) => {
                try {
                    const msg = JSON.parse(data);
                    if (msg.type === 'login' && !loggedIn) {
                        userName = msg.userName || '匿名用户';
                        loggedIn = true;
                        serverConnections.set(conn.peer, { conn, userName });
                        updateServerUI();

                        conn.send(JSON.stringify({
                            type: 'login_success',
                            serverName: name,
                            content: `✅ 连接到 ${name}`
                        }));

                        // 推送历史（包含所有消息，包括通知）
                        const history = getRecent(MAX_HISTORY);
                        if (history.length) {
                            conn.send(JSON.stringify({ type: 'history', messages: history }));
                        }

                        // 广播加入并存储
                        const sysMsg = `🟢 ${userName} 加入了聊天室`;
                        const ts = fmtTimestamp();
                        const tm = fmtTime();
                        addHistory('系统', sysMsg, ts, tm);   // 存储
                        broadcast('系统', sysMsg, ts, tm, conn.peer);
                        renderServerMsg('系统', sysMsg, tm, false, true);
                        updateServerUI();
                    }
                    else if (msg.type === 'text' && loggedIn) {
                        const content = msg.content.trim();
                        if (!content) return;
                        const ts = fmtTimestamp();
                        const tm = fmtTime();
                        addHistory(userName, content, ts, tm);  // 存储普通消息
                        broadcast(userName, content, ts, tm);
                        renderServerMsg(userName, content, tm, false);
                    }
                } catch (e) { console.error('处理消息失败:', e); }
            };

            conn.on('data', handler);
            conn.on('close', () => {
                if (serverConnections.has(conn.peer)) {
                    const info = serverConnections.get(conn.peer);
                    const leave = `🔴 ${info.userName} 离开了聊天室`;
                    const ts = fmtTimestamp();
                    const tm = fmtTime();
                    addHistory('系统', leave, ts, tm);   // 存储离开通知
                    broadcast('系统', leave, ts, tm);
                    renderServerMsg('系统', leave, tm, false, true);
                    serverConnections.delete(conn.peer);
                    updateServerUI();
                }
            });
            conn.on('error', (err) => console.error('连接错误:', err));
        });

        serverPeer.on('error', (err) => {
            console.error('服务器错误:', err);
            if (err.type === 'unavailable-id') {
                serverStatusBadge.textContent = '❌ ID 被占用';
                serverStatusBadge.className = 'status-badge error';
                startServerBtn.textContent = '⚠️ 冲突';
                startServerBtn.disabled = true;
                stopServerBtn.disabled = true;
                serverStarted = false;
                serverNameInput.disabled = false;
            } else {
                serverStatusBadge.textContent = '❌ 错误';
                serverStatusBadge.className = 'status-badge error';
            }
        });

        serverPeer.on('disconnected', () => {
            console.log('⚠️ 信令断开，重连中...');
            serverStatusBadge.textContent = '⚠️ 重连中';
            serverStatusBadge.className = 'status-badge off';
            serverPeer.reconnect();
        });
    }

    function stopServer() {
        if (!serverStarted || !serverPeer) return;

        // 询问是否清空所有历史记录（共享存储）
        const shouldClear = confirm('是否清空所有历史消息？（所有节点共享的历史将被清除）');
        if (shouldClear) {
            clearHistory();
            console.log('🗑️ 已清空全部历史记录');
            renderServerMsg('系统', '🗑️ 全部历史记录已清空', fmtTime(), false, true);
        }

        console.log('⏹ 停止服务器...');
        for (const [pid, info] of serverConnections) {
            try { info.conn.close(); } catch (e) {}
        }
        serverConnections.clear();
        serverPeer.destroy();
        serverPeer = null;
        serverStarted = false;

        serverNodeId.textContent = '—';
        serverStatusBadge.textContent = '已停止';
        serverStatusBadge.className = 'status-badge off';
        startServerBtn.textContent = '▶ 启动';
        startServerBtn.disabled = false;
        stopServerBtn.disabled = true;
        serverNameInput.disabled = false;
        serverMsgInput.disabled = true;
        serverSendBtn.disabled = true;
        setServerStatus('服务器已停止');
        updateServerUI();
    }

    // 服务器聊天渲染
    function renderServerMsg(sender, content, time, isMine = false, isSystem = false) {
        const div = document.createElement('div');
        div.className = 'message';
        if (isSystem) {
            div.classList.add('system');
            div.textContent = content;
        } else {
            if (isMine) div.classList.add('mine');
            const s = document.createElement('span');
            s.className = 'sender';
            s.textContent = sender;
            div.appendChild(s);
            const c = document.createElement('span');
            c.textContent = content;
            div.appendChild(c);
            const t = document.createElement('span');
            t.className = 'time';
            t.textContent = time || fmtTime();
            div.appendChild(t);
        }
        serverChat.appendChild(div);
        serverChat.scrollTop = serverChat.scrollHeight;
    }

    function setServerStatus(msg) {
        serverChat.innerHTML = '';
        const div = document.createElement('div');
        div.className = 'status-msg';
        div.textContent = msg;
        serverChat.appendChild(div);
    }

    // ============================================================
    // 客户端逻辑
    // ============================================================
    let clientPeer = null;
    let clientConn = null;
    let clientConnected = false;
    let clientMyName = '';

    function connectAsClient(serverName, userName) {
        if (clientPeer) { clientPeer.destroy(); clientPeer = null; }
        if (clientConn) { clientConn.close(); clientConn = null; }
        clientConnected = false;
        clientMsgInput.disabled = true;
        clientSendBtn.disabled = true;
        clearClientMessages();
        setClientStatus('🔄 连接中...');

        const cid = 'client-' + Date.now() + '-' + Math.random().toString(36).substr(2, 6);
        clientPeer = new Peer(cid, {
            debug: 2,
            config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
        });

        clientPeer.on('open', (id) => {
            console.log('客户端 Peer ID:', id);
            clientConn = clientPeer.connect(serverName, { reliable: true });

            clientConn.on('open', () => {
                console.log('P2P 连接已建立');
                clientConn.send(JSON.stringify({ type: 'login', userName }));
            });

            clientConn.on('data', (data) => {
                try { handleClientMessage(JSON.parse(data)); } catch (e) { console.error('解析失败:', e); }
            });

            clientConn.on('close', () => {
                clientConnected = false;
                clientMsgInput.disabled = true;
                clientSendBtn.disabled = true;
                setClientStatus('🔌 连接已断开');
                document.getElementById('clientLoginArea').style.display = 'block';
            });

            clientConn.on('error', (err) => {
                console.error('连接错误:', err);
                showClientError('连接错误: ' + err.message);
                document.getElementById('clientLoginArea').style.display = 'block';
            });
        });

        clientPeer.on('error', (err) => {
            console.error('客户端 Peer 错误:', err);
            if (err.type === 'peer-unavailable') {
                showClientError(`服务器 "${serverName}" 不存在`);
                setClientStatus(`❌ 服务器 "${serverName}" 不存在`);
            } else {
                showClientError('连接失败: ' + err.message);
                setClientStatus('❌ 连接失败');
            }
            document.getElementById('clientLoginArea').style.display = 'block';
        });
    }

    function handleClientMessage(msg) {
        switch (msg.type) {
            case 'login_success':
                clientConnected = true;
                clientMyName = clientUserName.value.trim();
                clientMsgInput.disabled = false;
                clientSendBtn.disabled = false;
                document.getElementById('clientLoginArea').style.display = 'none';
                clearClientMessages();
                // 显示欢迎消息（系统消息，不受开关影响）
                const container = clientChat;
                const div = document.createElement('div');
                div.className = 'message system';
                div.textContent = '✅ ' + msg.content;
                container.appendChild(div);
                const div2 = document.createElement('div');
                div2.className = 'message system';
                div2.textContent = '💡 开始聊天！';
                container.appendChild(div2);
                break;
            case 'history':
                if (msg.messages && msg.messages.length) {
                    for (const m of msg.messages) {
                        // 所有消息都加入（包括系统通知），客户端开关控制显示
                        clientAllMessages.push({
                            sender: m.sender,
                            content: m.content,
                            time: m.time,
                            isMine: (m.sender === clientMyName)
                        });
                    }
                    renderClientMessages();
                }
                break;
            case 'text':
                // 如果是自己发的，跳过（已本地显示）
                if (msg.sender === clientMyName) return;
                const isSystem = (msg.sender === '系统');
                if (isSystem) {
                    if (!showSystemMsg.checked) {
                        const content = msg.content || '';
                        if (content.includes('加入了聊天室') || content.includes('离开了聊天室')) {
                            return;
                        }
                    }
                }
                clientAllMessages.push({
                    sender: msg.sender,
                    content: msg.content,
                    time: msg.time,
                    isMine: false
                });
                renderClientMessages();
                break;
            default: break;
        }
    }

    function showClientError(msg) {
        const el = clientError;
        el.textContent = '❌ ' + msg;
        el.style.display = 'block';
        setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    // ============================================================
    // 选项卡切换
    // ============================================================
    tabs.forEach(btn => {
        btn.addEventListener('click', function() {
            tabs.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            const mode = this.dataset.tab;
            modeBadge.textContent = mode === 'server' ? '服务器' : '客户端';
            panes.server.classList.toggle('active', mode === 'server');
            panes.client.classList.toggle('active', mode === 'client');
        });
    });

    // ============================================================
    // 事件绑定
    // ============================================================
    startServerBtn.addEventListener('click', startServer);
    stopServerBtn.addEventListener('click', stopServer);

    serverSendBtn.addEventListener('click', function() {
        const text = serverMsgInput.value.trim();
        if (!text || !serverStarted || serverConnections.size === 0) {
            console.warn('无法广播');
            return;
        }
        const ts = fmtTimestamp();
        const tm = fmtTime();
        addHistory('系统', `📢 ${text}`, ts, tm);
        broadcast('系统', `📢 ${text}`, ts, tm);
        renderServerMsg('系统', `📢 ${text}`, tm, false, true);
        serverMsgInput.value = '';
    });

    serverMsgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') serverSendBtn.click(); });

    clientConnectBtn.addEventListener('click', function() {
        const server = clientServerName.value.trim();
        const userName = clientUserName.value.trim();
        if (!server) { showClientError('请输入服务器节点名称'); clientServerName.focus(); return; }
        if (!userName) { showClientError('请输入你的昵称'); clientUserName.focus(); return; }
        if (userName.length > 20) { showClientError('昵称最长20位'); return; }
        clientError.style.display = 'none';
        connectAsClient(server, userName);
    });

    clientUserName.addEventListener('keydown', (e) => { if (e.key === 'Enter') clientConnectBtn.click(); });
    clientServerName.addEventListener('keydown', (e) => { if (e.key === 'Enter') clientConnectBtn.click(); });

    clientSendBtn.addEventListener('click', function() {
        const text = clientMsgInput.value.trim();
        if (!text || !clientConnected || !clientConn) return;
        const tm = fmtTime();
        addClientMessage(clientMyName, text, tm, true);
        clientConn.send(JSON.stringify({ type: 'text', content: text }));
        clientMsgInput.value = '';
    });

    clientMsgInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); clientSendBtn.click(); }
    });

    showSystemMsg.addEventListener('change', function() {
        renderClientMessages();
    });

    // ============================================================
    // 同步服务器名称到客户端默认值（双向）
    // ============================================================
    serverNameInput.addEventListener('input', function() {
        clientServerName.value = this.value;
    });
    clientServerName.addEventListener('input', function() {
        if (!serverNameInput.disabled) {
            serverNameInput.value = this.value;
        }
    });

    // ============================================================
    // 初始化界面
    // ============================================================
    setServerStatus('点击「启动」开始监听');
    setClientStatus('请先连接服务器');
    stopServerBtn.disabled = true;

    console.log('✅ 界面初始化完成');
    console.log('📌 所有节点共享同一份历史记录');
</script>
</body>
</html>
